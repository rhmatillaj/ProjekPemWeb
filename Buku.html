<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookShelf</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
        <section class="py-5">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold mb-1">
                        Semua Buku
                    </h2>

                    <p class="text-muted mb-0">
                        6 buku tersedia
                    </p>
                </div>
            </div>
            <!--Grid Buku-->
            <div class="row g-4">
                <!--Buku 1-->
                <div class="col-12 col-md-6 col-lg-4">
                    <div class="card book-card h-100 shadow-sm border-0">
                        <div class="card-body d-flex flex-column">
                            <div class="d-flex gap-3">
                                <!--cover-->
                                <div class="book-cover">
                                    <img src="gambar" alt="cover buku 1">
                                </div>
                                <!--informasi-->
                                <div>
                                    <p class="text-muted mb-1">kategori</p>
                                    <h5 class="card-title fw-bold mb-1">Judul</h5>
                                    <p class="text-muted mb-2">Penulis</p>

                                    <p class="rating mb-3">⭐ 0 / 5.0</p>
                                </div>
                            </div>
                            <p class="card-text text-muted mt-3 mb-4">
                                Deskripsi
                            </p>

                            <a href="detail.html" class="btn btn-primary btn-sm">Baca Review</a>
                        </div>
                    </div>
                </div>
        </section>


</body>
</html>
